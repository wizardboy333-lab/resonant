# Fly.io app configuration for the Resonant web frontend.
app = "resonant-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  API_INTERNAL_URL = "http://resonant-api.internal:8000"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
