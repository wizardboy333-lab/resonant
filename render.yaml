# Render Blueprint for Resonant. Import this file from a GitHub repository.
# Paths are relative to the repo root (no rootDir — avoids api/api doubling).
services:
  - type: web
    name: resonant-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DOWNLOAD_DIR
        value: /tmp/ytaudio
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: resonant-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      - key: API_INTERNAL_URL
        value: https://resonant-api-63qd.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: ""
